#
# Settings are read in the following order:
#
# 1. Intrinsic defaults
# 2. /etc/tlp.d/*.conf - Drop-in customization snippets
# 3. /etc/tlp.conf     - User configuration (this file)
#
# TLP profiles: a part of TLP's parameters is divided into two or three
# groups:
# - performance: parameters ending in _AC are used when AC power is
#   connected or when the command 'tlp performance' is run.
# - balanced: parameters ending in _BAT are used when operating
#   on battery power or when the command 'tlp balanced' is run.
# - power-saver: parameters ending in _SAV are used when the command
#   'tlp power-saver' is run. If there is no _SAV parameter available
#   for a feature, the _BAT parameter will be used instead.
# - Any remaining parameters not divided apply to all TLP profiles.
#
# Please note:
# - If parameters are specified more than once, the last occurrence takes
#   precedence. This also means that any parameters defined here will take
#   precedence over any drop-ins.
# - You can however, append values to a parameter already defined as default
#   or in a previously read file: use PARAMETER+="add values".
# - Important: in its native state, all of the parameters in this file are
#   commented out with a leading '#', so the defaults (if any) apply.
#   Remove the leading '#' if you want to enable a feature without a default
#   or if you want to set a value other than the default.
# - Parameters must always be specified for all TLP profiles, i.e. in the
#   AC, BAT and SAV category (where applicable). If you omit one of them,
#   the missing profile will receive its value from another profile, since
#   a change will only occur if different values are defined.
# - To completely disable a feature, use PARAMETER="".
# Legend for defaults:
# - Default *: effective value when the parameter is missing or the line has
#   a leading '#'.
# - Default <none>: feature disabled, use kernel or hardware defaults.
#
# ----------------------------------------------------------------------------
# tlp - Parameters for power saving

# Set to 0 to disable, 1 to enable TLP.
# Default: 1
TLP_ENABLE=1

# Set to 1 to disable (almost) all defaults of TLP.
# This means that TLP only applies settings that have been explicitly activated
# i.e. parameters without leading '#'.
# Notes:
# - Helpful if one wants to use only selected features of TLP
# - After activation, use tlp-stat -c to display your effective configuration
# - TLP's operation relies on the defaults of TLP_ENABLE, TLP_WARN_LEVEL,
#   TLP_AUTO_SWITCH, and TLP_PROFILE_AC/BAT, which are *not* disabled
#
TLP_DISABLE_DEFAULTS=1

# Control automatic switching of the TLP profile when connecting or removing
# the charger, when booting the system or when executing 'tlp start':
#   0=disabled - never switch, use TLP_PROFILE_DEFAULT if configured
#   1=auto  - always switch, select TLP_PROFILE_AC on AC and TLP_PROFILE_BAT
#             on battery power.
#   2=smart - like auto, but skips the switch if you have manually changed the
#             profile away from the previous power source's default profile
#             (as defined by TLP_PROFILE_AC/BAT).
# Note: the same applies if the charger was connected/removed during suspend.
# Default: 2
TLP_AUTO_SWITCH=2

# TLP profiles to use when automatic switching is enabled
# (TLP_AUTO_SWITCH=1 or 2):
#   PRF=performance, BAL=balanced, SAV=power-saver.
# Default: PRF (AC power), BAL (battery power)
TLP_PROFILE_AC=PRF
TLP_PROFILE_BAT=BAL

# TLP profile to use when automatic switching is disabled
# (TLP_AUTO_SWITCH=0) or no power supply is detected:
#   PRF=performance, BAL=balanced, SAV=power-saver.
# Note: legacy values AC and BAT continue to work. They are mapped to
# PRF and BAL, respectively.
# Default: <none>
TLP_PROFILE_DEFAULT=BAL

# Seconds laptop_mode has to wait after the disk goes idle before doing a
# sync. Non-zero value enables, zero disables laptop_mode.
# Note: will be ignored starting with kernel 7.0
# Default: 0 (AC), 2 (BAT)
DISK_IDLE_SECS_ON_AC=0
DISK_IDLE_SECS_ON_BAT=2

# Dirty page values (timeouts in secs).
# Default: 15 (AC), 60 (BAT)
MAX_LOST_WORK_SECS_ON_AC=15
MAX_LOST_WORK_SECS_ON_BAT=60

# Kernel NMI Watchdog:
#   0=disable (default, saves power), 1=enable (for kernel debugging only).
# Default: 0
NMI_WATCHDOG=0

# Select platform profile:
#   performance, balanced, low-power.
# Controls system operating characteristics around power/performance levels,
# thermal and fan speed. Values are given in order of increasing power saving.
# Note: check the output of tlp-stat -p to determine availability on your
# hardware and additional profiles such as: balanced-performance, quiet, cool.
# Default: performance (AC), balanced (BAT), low-power (SAV)
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=balanced
PLATFORM_PROFILE_ON_SAV=low-power

# Define disk devices on which the following DISK/AHCI_RUNTIME parameters act.
# Separate multiple devices with spaces.
# Devices can be specified by disk ID also (lookup with: tlp diskid).
# Default: "nvme0n1 sda"
DISK_DEVICES="nvme0n1 sda"

# Disk advanced power management level: 1..254, 255 (max saving, min, off).
# Levels 1..127 may spin down the disk; 255 allowable on most drives.
# Separate values for multiple disks with spaces. Use the special value 'keep'
# to keep the hardware default for the particular disk.
# Default: 254 (AC), 128 (BAT)
DISK_APM_LEVEL_ON_AC="254 254"
DISK_APM_LEVEL_ON_BAT="128 128"

# Exclude disk classes from advanced power management (APM):
#   sata, ata, usb, ieee1394.
# Separate multiple classes with spaces.
# CAUTION: USB and IEEE1394 disks may fail to mount or data may get corrupted
# with APM enabled. Be careful and make sure you have backups of all affected
# media before removing 'usb' or 'ieee1394' from the denylist!
# Default: "usb ieee1394"
DISK_APM_CLASS_DENYLIST="usb ieee1394"

# AHCI link power management (ALPM) for SATA disks:
#   min_power, med_power_with_dipm(*), medium_power, max_performance.
# (*) recommended.
# Multiple values separated with spaces are tried sequentially until success.
# Default: med_power_with_dipm (AC & BAT)
SATA_LINKPWR_ON_AC="med_power_with_dipm"
SATA_LINKPWR_ON_BAT="med_power_with_dipm"

# Runtime Power Management for NVMe, SATA, ATA and USB disks
# as well as SATA ports:
#   on=disable, auto=enable.
# Note: SATA controllers are PCIe bus devices and handled by RUNTIME_PM
# further down.
# Default: on (AC), auto (BAT)
AHCI_RUNTIME_PM_ON_AC=on
AHCI_RUNTIME_PM_ON_BAT=auto

# Seconds of inactivity before disk is suspended.
# Note: effective only when AHCI_RUNTIME_PM_ON_AC/BAT is activated.
# Default: 15
AHCI_RUNTIME_PM_TIMEOUT=15

# Intel GPU power management.
# Select power profile for the Intel Xe GPU: base, power_saving.
# Note: requires xe driver.
# Default: base (AC), power_saving (BAT), power_saving (SAV)
INTEL_GPU_POWER_PROFILE_ON_AC=base
INTEL_GPU_POWER_PROFILE_ON_BAT=base
INTEL_GPU_POWER_PROFILE_ON_SAV=power_saving

# AMD GPU power management.
# Performance level (DPM): high, auto, low; auto is recommended.
# Note: requires amdgpu or radeon driver.
# Default: auto (AC), auto (BAT), low (SAV)
RADEON_DPM_PERF_LEVEL_ON_AC=auto
RADEON_DPM_PERF_LEVEL_ON_BAT=auto
RADEON_DPM_PERF_LEVEL_ON_SAV=low

# Wi-Fi power saving mode: on=enable, off=disable.
# Default: off (AC), on (BAT)
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=off

# Disable Wake-on-LAN: Y/N.
# Default: Y
WOL_DISABLE=Y

# Enable audio power saving for Intel HDA, AC97 devices (timeout in secs).
# A value of 0 disables, >= 1 enables power saving.
# Note: 1 is recommended for Linux desktop environments with PulseAudio,
# systems without PulseAudio may require 10.
# Default: 1
SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1

# Disable controller too (HDA only): Y/N.
# Note: effective only when SOUND_POWER_SAVE_ON_AC/BAT is activated.
# Default: Y
SOUND_POWER_SAVE_CONTROLLER=Y

# PCIe Active State Power Management (ASPM):
#   default(*), performance, powersave, powersupersave.
# (*) keeps BIOS ASPM defaults (recommended)
# Default: default
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=default
PCIE_ASPM_ON_SAV=default

# Autosuspend PCIe devices (Runtime Power Management):
#   on=disable, auto=enable.
# Default: on (AC), auto (BAT)
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto

# Autosuspend USB devices:
#   0=disable, 1=enable.
# Default: 1
USB_AUTOSUSPEND=1
