# Settings are read in the following order:
#
# 1. Intrinsic defaults
# 2. /etc/tlp.d/*.conf - Drop-in customization snippets
# 3. /etc/tlp.conf     - User configuration (this file)
#
# TLP profiles: a part of TLP's parameters is divided into two or three
# groups:
# - performance: parameters ending in _AC are used when AC power is
#   connected or when the command 'tlp performance' is run.
# - balanced: parameters ending in _BAT are used when operating
#   on battery power or when the command 'tlp balanced' is run.
# - power-saver: parameters ending in _SAV are used when the command
#   'tlp power-saver' is run. If there is no _SAV parameter available
#   for a feature, the _BAT parameter will be used instead.
# - Any remaining parameters not divided apply to all TLP profiles.
#
# Please note:
# - If parameters are specified more than once, the last occurrence takes
#   precedence. This also means that any parameters defined here will take
#   precedence over any drop-ins.
# - You can however, append values to a parameter already defined as default
#   or in a previously read file: use PARAMETER+="add values".
# - Important: in its native state, all of the parameters in this file are
#   commented out with a leading '#', so the defaults (if any) apply.
#   Remove the leading '#' if you want to enable a feature without a default
#   or if you want to set a value other than the default.
# - Parameters must always be specified for all TLP profiles, i.e. in the
#   AC, BAT and SAV category (where applicable). If you omit one of them,
#   the missing profile will receive its value from another profile, since
#   a change will only occur if different values are defined.
# - To completely disable a feature, use PARAMETER="".
# Legend for defaults:
# - Default *: effective value when the parameter is missing or the line has
#   a leading '#'.
# - Default <none>: feature disabled, use kernel or hardware defaults.
#
# ----------------------------------------------------------------------------
# tlp - Parameters for power saving

# Intel GPU power management.
# Select power profile for the Intel Xe GPU: base, power_saving.
# Note: requires xe driver.
# Default: base (AC), power_saving (BAT), power_saving (SAV)
INTEL_GPU_POWER_PROFILE_ON_AC=base
INTEL_GPU_POWER_PROFILE_ON_BAT=base
INTEL_GPU_POWER_PROFILE_ON_SAV=power_saving

# AMD GPU power management.
# Performance level (DPM): high, auto, low; auto is recommended.
# Note: requires amdgpu or radeon driver.
# Default: auto (AC), auto (BAT), low (SAV)
RADEON_DPM_PERF_LEVEL_ON_AC=auto
RADEON_DPM_PERF_LEVEL_ON_BAT=auto
RADEON_DPM_PERF_LEVEL_ON_SAV=low
