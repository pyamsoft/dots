# https://wiki.archlinux.org/title/Fwupd
# use `man 5 fwupd.conf` for documentation

# https://wiki.archlinux.org/title/Fwupd#Disable_local_cache_server_(passim)
[fwupd]
P2pPolicy=nothing

# https://wiki.archlinux.org/title/Fwupd#Assisted_process_with_sbctl
[uefi_capsule]
DisableShimForSecureBoot=true
