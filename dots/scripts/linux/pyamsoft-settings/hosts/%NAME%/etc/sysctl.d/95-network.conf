# https://www.kernel.org/doc/Documentation/networking/ip-sysctl.txt

# Harden BPF JIT
net.core.bpf_jit_harden = 2

# https://wiki.archlinux.org/title/Sysctl#Enable_BBR
#
# Use `fq` instead of `cake` for qdisc
# with BBR, fq is a better match for packet pacing
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# TCP shrink window
# https://docs.pixeldrain.com/posts/2024-03-07_network_optimizations/
net.ipv4.tcp_shrink_window = 1

# From CachyOS-Settings
# https://github.com/CachyOS/CachyOS-Settings
#######################################
net.core.netdev_max_backlog = 4096

# Since the backlog is bumped from 1000 -> 4096
# we should also increase the time budget it is allowed to use
net.core.netdev_budget = 600
