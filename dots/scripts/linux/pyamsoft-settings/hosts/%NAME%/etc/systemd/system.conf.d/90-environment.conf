# Disable ONNX runtime telemetry
#
# Since random projects upstream may make use of onnx internally but not be
# aware about it's built in telemetry, we disable it at a system environment level
#
# https://github.com/immich-app/immich/issues/30729
[Manager]
DefaultEnvironment="ORT_DISABLE_TELEMETRY=1"
ManagerEnvironment="ORT_DISABLE_TELEMETRY=1"
